  <title>Trips</title>

  <script defer src="firebase-config.js?v=43-swap-template"></script>
  <script defer src="locale.js?v=43-swap-template"></script>
  <script defer src="seed.js?v=43-swap-template"></script>
  <script defer src="seed-research.js?v=43-swap-template"></script>
  <script defer src="store.js?v=43-swap-template"></script>
  <script defer src="fashion-catalog.js?v=43-swap-template"></script>
  <script defer src="places.js?v=43-swap-template"></script>
  <script defer src="reco.js?v=43-swap-template"></script>
  <script defer src="fx.js?v=43-swap-template"></script>
  <script defer src="receipt.js?v=43-swap-template"></script>

  <script defer src="slowpoke.js?v=43-swap-template"></script>
</head>
<body>
  <div id="app"></div>

  <dialog id="sheet" aria-labelledby="sheet-title">
    <form id="sheet-form" novalidate>
      <div class="sheet-head"><span class="grab" aria-hidden="true"></span><h2 id="sheet-title"></h2><button type="button" id="sheet-close" class="icon-btn" aria-label="Close">✕</button></div>
      <div id="sheet-body"></div>
      <p id="sheet-error" role="alert"></p>
      <div class="sheet-foot"><button class="primary wide" id="sheet-submit" type="submit">Save</button></div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script>
    // Offline support + installable app. Only works when served over https (or localhost).
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      // If an older version was already running, reload once when the new one takes over, so a deploy shows without a manual second reload.
      const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
